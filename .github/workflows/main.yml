name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建的标签名 (例如: v1.0.0)'
        required: true
        type: string
      release_notes:
        description: '发布说明 (可选，默认使用 .github/release_notes.md)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          case "$RELEASE_TAG" in
            */*|*\\*) echo '::error::Release 标签不能包含路径分隔符。'; exit 1 ;;
          esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android SDK
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" 'platforms;android-37.0' 'build-tools;34.0.0' 'cmake;3.22.1'

      - name: Prepare Rust USB toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Prepare USB test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
          cargo fetch --locked --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml

      - name: Check Rust USB core
        run: |
          cargo fmt --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml -- --check
          cargo test --offline --locked --all-features --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml
          cargo clippy --offline --locked --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build arm64 and x86_64 release APKs
        run: bash ./gradlew --no-daemon -PmeiAbiSplits=true :app:assembleRelease

      - uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Verify and prepare release APKs
        run: python3 tools/ci/prepare-apks.py --name "Mei_${RELEASE_TAG}" --output release-artifacts

      - name: Read Release Notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          notes = os.environ.get("RELEASE_NOTES", "")
          if not notes:
              source = Path(".github/release_notes.md")
              notes = source.read_text() if source.is_file() else f"Release {os.environ['RELEASE_TAG']}"
          Path("release-notes.md").write_text(notes)
          PYTHON

      # 手动触发时需要先创建标签
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/*.apk"
          artifactContentType: application/vnd.android.package-archive
          artifactErrorsFailBuild: true
          token: ${{ github.token }}
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name, '-') }}
          bodyFile: release-notes.md
          # 手动触发时，如果标签已存在则跳过创建
          skipIfReleaseExists: true
