name: Beta Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Name build artifact
        id: metadata
        run: |
          short_sha=$(git rev-parse --short=8 HEAD)
          echo "name=Mei_beta_${GITHUB_RUN_NUMBER}_${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android SDK
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" 'platforms;android-37.0' 'build-tools;34.0.0' 'cmake;3.22.1'

      - name: Prepare Rust USB toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Prepare USB test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
          cargo fetch --locked --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml

      - name: Check Rust USB core
        run: |
          cargo fmt --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml -- --check
          cargo test --offline --locked --all-features --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml
          cargo clippy --offline --locked --manifest-path app/src/main/rust/mei-usb-core/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build arm64 and x86_64 test APKs
        run: bash ./gradlew --no-daemon -PmeiAbiSplits=true :app:assembleRelease

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Verify and prepare test APKs
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.name }}
          SIGNED_APKS: ${{ steps.sign_app.outputs.signedReleaseFiles }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          expected = {"arm64-v8a", "x86_64"}
          signed_apks = [Path(p) for p in os.environ["SIGNED_APKS"].split(":") if p]
          if len(signed_apks) != len(expected):
              raise SystemExit("Expected exactly two signed APKs.")

          output = Path("build-artifacts")
          output.mkdir(exist_ok=True)
          seen = set()
          for apk in signed_apks:
              with ZipFile(apk) as archive:
                  abis = {
                      parts[1]
                      for name in archive.namelist()
                      if len(parts := name.split("/")) == 3
                      and parts[0] == "lib" and name.endswith(".so")
                  }
              if len(abis) != 1 or not abis <= expected or abis & seen:
                  raise SystemExit(f"Unexpected or duplicate native ABIs in {apk}: {abis}")
              abi = abis.pop()
              seen.add(abi)
              target = output / f"{os.environ['ARTIFACT_NAME']}_{abi}.apk"
              shutil.copyfile(apk, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              target.with_suffix(".apk.sha256").write_text(f"{digest}  {target.name}\n")
              print(f"Prepared {target.name} ({target.stat().st_size} bytes)")
          if seen != expected:
              raise SystemExit(f"Missing APKs: {expected - seen}")
          PYTHON

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
